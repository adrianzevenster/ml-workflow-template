# pipeline inputs
record_id: 123
work_dir: work/${record_id}

# GCP & model identifiers
project_id: your‑gcp-project
location: us-central1
docai_processor_id: your‑docai-processor-id
endpoint_id: your‑vertex-endpoint-id

# BigQuery dataset for logs
logs_dataset: logs_dataset

# Logging sink names
docai_log_sink_name: docai_to_bq
vertex_log_sink_name: vertexai_to_bq

# Monitoring job settings
monitoring_job_name: gemini-monitoring-job
logging_sampling_percentage: 10.0
drift_threshold: 0.05
monitor_interval_hours: 1

# downstream params…
required_fields:
  - NAME
  - DATE
  - ID_NUMBER
min_text_length: 100
min_entities: 1
