stages:
  setup_logging:
    cmd: >
      bash scripts/setup_gcp_logging.sh
      ${project_id} ${location}
      ${docai_processor_id} ${endpoint_id}
      ${logs_dataset}
      ${docai_log_sink_name} ${vertex_log_sink_name}
      ${monitoring_job_name}
      ${logging_sampling_percentage}
      ${drift_threshold}
      ${monitor_interval_hours}
    deps:
      - scripts/setup_gcp_logging.sh
      - params.yaml
    params:
      - project_id
      - location
      - docai_processor_id
      - endpoint_id
      - logs_dataset
      - docai_log_sink_name
      - vertex_log_sink_name
      - monitoring_job_name
      - logging_sampling_percentage
      - drift_threshold
      - monitor_interval_hours

  run_pipeline:
    cmd: python main.py --record-id ${record_id} --work-dir ${work_dir}
    deps:
      - main.py
      - config.py
      - scripts/db_fetch.py
      - scripts/pdf_sanitize.py
      - scripts/gcs_upload.py
      - scripts/docai_process.py
      - scripts/gemini_process.py
    params:
      - record_id
      - work_dir
    outs:
      - ${work_dir}/docai_raw.json
      - ${work_dir}/gemini_raw.json
      - ${work_dir}/${record_id}_results.json

  post_process:
    cmd: >
      python scripts/result_processor.py \
        ${work_dir}/docai_raw.json \
        ${work_dir}/gemini_raw.json \
        ${work_dir}/analysis.json \
        --required-fields ${required_fields}
    deps:
      - scripts/result_processor.py
      - ${work_dir}/docai_raw.json
      - ${work_dir}/gemini_raw.json
      - params.yaml
    params:
      - required_fields
    outs:
      - ${work_dir}/analysis.json

  data_quality:
    cmd: python scripts/quality_checks.py \
      ${work_dir}/docai_raw.json \
      ${work_dir}/gemini_raw.json \
      ${work_dir}/analysis.json \
      ${work_dir}/metrics.json \
      --min-text-length ${min_text_length} \
      --min-entities ${min_entities}
    deps:
      - scripts/quality_checks.py
      - ${work_dir}/docai_raw.json
      - ${work_dir}/gemini_raw.json
      - ${work_dir}/analysis.json
      - params.yaml
    params:
      - min_text_length
      - min_entities
    outs:
      - ${work_dir}/metrics.json
    metrics:
      - ${work_dir}/metrics.json
  lint:
    cmd: flake8 .
    deps:
      - .flake8
      - requirements.txt
      - main.py
      - config.py
      - scripts/db_fetch.py
      - scripts/pdf_sanitize.py
      - scripts/gcs_upload.py
      - scripts/docai_process.py
      - scripts/gemini_process.py
      - scripts/results_processor.py
      - scripts/quality_checks.py
      - scripts/setup_gcp_logging.sh
    outs: []
